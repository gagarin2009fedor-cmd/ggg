<!doctype html><html lang="ru"><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}.w{width:1000px;height:190px;padding:28px 35px;box-sizing:border-box;color:white;position:relative}.r{display:flex;align-items:center;gap:18px}.ico{width:48px;height:48px;border:2px solid #a00;border-radius:50%;background:#080000;box-shadow:0 0 15px #900;position:relative;flex:none}.ico:before,.ico:after{content:"";position:absolute;top:15px;width:7px;height:13px;background:#eee;border-radius:50%}.ico:before{left:12px}.ico:after{right:12px}.info{flex:1;min-width:0}.title{font-size:36px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px #200,0 4px 12px #000,0 0 14px #900}.time{font-size:21px;font-weight:800;min-width:165px;text-align:right;text-shadow:0 2px 8px #000}.sub{position:absolute;left:102px;top:103px;font-size:12px;letter-spacing:4px;color:#aaa}.bar{position:absolute;left:35px;right:35px;bottom:38px;height:15px;background:#160000;border:1px solid #444;transform:skewX(-10deg)}.fill{height:100%;width:0;background:linear-gradient(90deg,#300,#800,#e00000,#600);box-shadow:0 0 10px #c00}.dot{position:absolute;top:50%;left:0;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);background:#d00000;border:2px solid white;box-shadow:0 0 15px #d00}.warn{position:absolute;right:35px;bottom:61px;font-size:10px;letter-spacing:2px;color:#e66}
</style><body><div class="w"><div class="r"><div class="ico"></div><div class="info"><div class="title" id="t">Бабушка, отрезающая головы</div></div><div class="time" id="tm">00:00 / 26:05</div></div><div class="sub">RALPHHORROR // ARCHIVE</div><div class="bar"><div class="fill" id="f"></div><div class="dot" id="d"></div></div><div class="warn">DO NOT LOOK BACK</div></div><script>
const a=[["Бабушка, отрезающая головы",1565],["Они едят покойников",615],["Что ломилось в квартиру?",587],["На потолок посмотри!",671],["Больница, забирающая жизни",613],["Лучше не лезь на чердак",1404],["Оно приходит каждую ночь",652],["Пап, там под кроватью кто-то есть",861],["Твари, бегающие по полям",934],["В этой квартире живёт зло",1042],["Милый, я гнию!",1087],["Не нужно в больницах блог снимать",1087],["На электричке лучше не ехать",1102],["В ночную смену не ходи",755],["Сосед с перевёрнутой головой",1019],["Смрад из ванной",943],["Культ придёт за тобой",1800]];
let s=[],x=0;a.forEach(v=>{s.push({title:v[0],start:x,end:x+v[1]});x+=v[1]});const st=performance.now(),t=document.getElementById("t"),tm=document.getElementById("tm"),f=document.getElementById("f"),d=document.getElementById("d");
function fmt(n){n=Math.floor(Math.max(0,n));let h=Math.floor(n/3600),m=Math.floor(n%3600/60),q=n%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`}
function u(){let e=(performance.now()-st)/1000,z=s.find(v=>e>=v.start&&e<v.end)||s[s.length-1],l=Math.max(0,Math.min(e-z.start,z.end-z.start)),p=Math.min(100,l/(z.end-z.start)*100);t.textContent=z.title;tm.textContent=fmt(l)+" / "+fmt(z.end-z.start);f.style.width=p+"%";d.style.left=p+"%";requestAnimationFrame(u)}u();
</script></body></html>
